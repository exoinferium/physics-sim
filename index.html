<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Rigid Body Physics</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1218;
        color: #c8d0e0;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        background: #1a1f2a;
        border-bottom: 1px solid #2a3344;
        flex-wrap: wrap;
      }
      button {
        background: #2d3a52;
        color: #e8eef8;
        border: 1px solid #3d4d6a;
        padding: 0.35rem 0.65rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
      }
      button:hover {
        background: #3a4a66;
      }
      #hud {
        font-size: 0.8rem;
        opacity: 0.9;
        margin-left: auto;
      }
      canvas {
        display: block;
        flex: 1;
        width: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <button type="button" id="btn-reset">Reset scene</button>
        <button type="button" id="btn-drop">Drop stack</button>
        <span id="hud"></span>
      </div>
      <canvas id="c"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
